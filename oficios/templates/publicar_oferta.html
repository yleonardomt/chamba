{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMBA - Publicar oferta laboral</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/principal.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F3F2EF;
            background-image: radial-gradient(circle, #d1dae8 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .form-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, #0A66C2 0%, #004182 100%);
            color: white;
        }

        .form-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #1D1D1D;
        }

        .form-group label .required {
            color: #EF4444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #E5E7EB;
            border-radius: 0.8rem;
            font-size: 1.4rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0A66C2;
            box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-submit {
            width: 100%;
            background: #0A66C2;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #004182;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(10, 102, 194, 0.3);
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #0A66C2;
            text-decoration: none;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .btn-volver:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #E8F0FE;
            padding: 1rem;
            border-radius: 0.8rem;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: #0A66C2;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <div class="form-header">
            <h2><i class="fa-solid fa-briefcase"></i> Publicar nueva oferta laboral</h2>
        </div>
        <div class="form-body">
            <a href="{% url 'dashboard' %}" class="btn-volver">
                <i class="fas fa-arrow-left"></i> Volver al dashboard
            </a>

            <div class="info-box">
                <i class="fa-solid fa-circle-info"></i> Completa los datos para publicar tu oferta. Los trabajadores
                interesados podrán postularse.
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Nombre de la oferta <span class="required">*</span></label>
                    <input type="text" name="titulo" placeholder="Ej: Se necesita electricista para obra" required>
                </div>

                <div class="form-group">
                    <label>Oficio / Especialidad <span class="required">*</span></label>
                    <select name="oficio" required>
                        <option value="">Selecciona un oficio</option>
                        <option value="Electricista">⚡ Electricista</option>
                        <option value="Plomero">🔧 Plomero</option>
                        <option value="Carpintero">🪵 Carpintero</option>
                        <option value="Cocinero">🍳 Cocinero</option>
                        <option value="Limpieza">🧹 Limpieza</option>
                        <option value="Construcción">🏗️ Construcción</option>
                        <option value="Pintor">🎨 Pintor</option>
                        <option value="Jardinero">🌿 Jardinero</option>
                        <option value="Mecánico">🔧 Mecánico</option>
                        <option value="Otro">📌 Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descripción detallada <span class="required">*</span></label>
                    <textarea name="descripcion" rows="5"
                        placeholder="Describe las tareas, horario, requisitos, experiencia necesaria..."
                        required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ubicación <span class="required">*</span></label>
                        <input type="text" name="ubicacion" placeholder="Ej: Zona Sur, La Paz" required>
                    </div>
                    <div class="form-group">
                        <label>Remuneración</label>
                        <input type="text" name="remuneracion" placeholder="Ej: 2000 Bs / Por negociar">
                    </div>
                </div>

                <div class="form-group">
                    <label>Fecha límite</label>
                    <input type="date" name="fecha_limite">
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Publicar oferta
                </button>
            </form>
        </div>
    </div>

</body>

</html>
